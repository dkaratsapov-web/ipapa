# Справочник характеристик устройств айпапы (reference/specs.yaml).
#
# Отсюда бот и мини-апп берут характеристики для карточек товаров.
# Формат: раздел -> модель -> «подпись: значение». Порядок полей = порядок в карточке.
# Модель находится по названию товара без памяти, цвета, года и SIM
# («iPhone 17 Pro, 256 ГБ, eSIM» -> «iPhone 17 Pro»); регистр и бренд впереди не важны.
# Если на сайте модель называется иначе — добавьте «Другие названия: [..., ...]».
# «Источник» — ссылка для сверки, в карточке показывается как «Источник».
# Поле «Дата выхода» (ДД.ММ.ГГГГ или год) влияет на сортировку «Сначала новые».
#
# Модели без данных перечислены в конце каждого раздела — заполните, и они появятся
# в карточках после ближайшего обновления каталога (раз в час).


