# Ручная диагностика подбора характеристик: ответы Википедии -> ветка wiki-probe.
name: wiki-probe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install httpx
      - run: python scripts/wiki_probe.py
      - name: Коммит в ветку wiki-probe
        run: |
          cp wiki_probe.json /tmp/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan wiki-probe
          git rm -rfq .
          cp /tmp/wiki_probe.json .
          git add -A
          git commit -qm "Wiki probe $(date -u +%FT%TZ)"
          git push -f origin wiki-probe
